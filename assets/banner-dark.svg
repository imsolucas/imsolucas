<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Lucas — Deng Yi Jin. Full-stack developer who started in C.</title>
  <desc id="d">A rising line through three points labelled C, C++ and TypeScript.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#2a313c"/></pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="0.8" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="m"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7a45" stop-opacity="0.22"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1278" height="398" rx="20"/></clipPath>
  </defs>
  <style>
    .trace { stroke-dasharray: 1; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .2s backwards; }
    .area, .node { animation: show .6s ease-out backwards; }
    .n0 { animation-delay: .7s; } .n1 { animation-delay: 1.4s; } .n2 { animation-delay: 2.2s; } .area { animation-delay: 2.2s; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes show { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .trace, .area, .node { animation: none; } }
  </style>
  <rect x="1" y="1" width="1278" height="398" rx="20" fill="#10151d" stroke="#30363d" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect width="1280" height="400" fill="url(#dots)" mask="url(#m)"/>
    <path class="area" d="M820 286 C 860 286, 870 262, 903 258 S 960 262, 987 232 S 1020 196, 1062 196 S 1112 204, 1137 164 S 1178 110, 1220 110 L1220 318 L820 318 Z" fill="url(#area)"/>
    <line x1="820" y1="318" x2="1220" y2="318" stroke="#3d444d" stroke-width="1.5"/>
    <path class="trace" pathLength="1" d="M820 286 C 860 286, 870 262, 903 258 S 960 262, 987 232 S 1020 196, 1062 196 S 1112 204, 1137 164 S 1178 110, 1220 110" fill="none" stroke="#ff7a45" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="node n0">
      <circle cx="903" cy="258" r="9" fill="#10151d" stroke="#ff7a45" stroke-width="3.5"/>
      <text x="903" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#f0f6fc">C</text>
    </g>
    <g class="node n1">
      <circle cx="1062" cy="196" r="9" fill="#10151d" stroke="#ff7a45" stroke-width="3.5"/>
      <text x="1062" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#f0f6fc">C++</text>
    </g>
    <g class="node n2">
      <circle cx="1220" cy="110" r="9" fill="#10151d" stroke="#ff7a45" stroke-width="3.5"/>
      <text x="1230" y="82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#f0f6fc">TypeScript</text>
    </g>
  </g>
  <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" letter-spacing="3" fill="#ff7a45">42 KUALA LUMPUR · MALAYSIA</text>
  <text x="66" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="136" font-weight="800" letter-spacing="-5" fill="#f0f6fc">Lucas</text>
  <text x="72" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#9198a1">Deng Yi Jin</text>
  <text x="72" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#f0f6fc">Full-stack developer who started in C.</text>
</svg>
